<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Jade Rush</title>
<meta name="description" content="Jade Rush is a Mahjong tile-matching game with 5,000 levels, a clock to beat, and two-player online duels.">
<meta name="theme-color" content="#06121a">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="loader" aria-hidden="true"><div class="loader-tile">中</div><p>Jade <span>Rush</span></p></div>
<main id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <header class="home-top">
      <span class="star-pill" id="home-stars" aria-label="Stars collected">★ 0</span>
      <div class="home-top-actions">
        <button id="btn-howto" class="round-btn" aria-label="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.2-1.5 2.2v.6M12 18h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <button id="btn-settings" class="round-btn" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      </div>
    </header>

    <div class="brand">
      <div class="demo-tray"><canvas id="demo" aria-label="Tiles being matched on a small demo board"></canvas></div>
      <h1 class="logo"><span class="logo-jade">Jade</span><span class="logo-rush">Rush</span><i class="seal" aria-hidden="true">中</i></h1>
      <p class="tagline">Match the tiles · beat the clock</p>
    </div>

    <nav class="menu">
      <button id="btn-continue" class="cta">
        <span class="cta-shine" aria-hidden="true"></span>
        <span class="cta-text">
          <span class="cta-eyebrow" id="continue-eyebrow">Journey · 5,000 levels</span>
          <span class="cta-title" id="continue-label">Level 1</span>
          <span class="cta-meta" id="continue-meta">0 cleared</span>
        </span>
        <span class="cta-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></span>
        <span class="cta-progress" aria-hidden="true"><i id="journey-fill"></i></span>
      </button>

      <div class="quick">
        <button id="btn-levels" class="qtile">
          <span class="qface" aria-hidden="true"><b>萬</b></span>
          <span class="tile-title">Level map</span>
          <span class="tile-meta" id="levels-meta">Replay for 3 ★</span>
        </button>
        <button id="btn-daily" class="qtile q-red">
          <span class="qface" aria-hidden="true"><b>東</b></span>
          <span class="tile-title">Daily board</span>
          <span class="tile-meta" id="daily-meta">New every day</span>
        </button>
        <button id="btn-themes" class="qtile q-green">
          <span class="qface" aria-hidden="true"><b>發</b></span>
          <span class="tile-title">Tile sets</span>
          <span class="tile-meta" id="themes-meta">1 of 6 unlocked</span>
        </button>
      </div>

      <section class="duel-card" aria-labelledby="duel-h">
        <h2 class="duel-h" id="duel-h"><span>Duel</span><small>2 players</small></h2>
        <div class="duel-row">
          <button id="btn-online" class="duel-opt"><i aria-hidden="true">中</i><span class="tile-title">Online</span><span class="tile-meta" id="online-meta">Race or turns</span></button>
          <button id="btn-local" class="duel-opt"><i aria-hidden="true">南</i><span class="tile-title">Pass &amp; play</span><span class="tile-meta">One device</span></button>
          <button id="btn-ai" class="duel-opt"><i aria-hidden="true">北</i><span class="tile-title">Vs computer</span><span class="tile-meta" id="ai-meta">3 levels</span></button>
        </div>
      </section>
    </nav>
    <p class="sky-hint" aria-hidden="true">Tap the sky to release a lantern</p>
  </section>

  <!-- LEVEL MAP -->
  <section id="levels" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back">←</button>
      <h2 class="bar-title">Level map</h2>
      <span class="bar-side" id="levels-stars">0 ★</span>
    </header>
    <div class="level-scroll" id="level-grid"></div>
  </section>

  <!-- FRIENDS -->
  <section id="friends" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back">←</button>
      <h2 class="bar-title">Friends</h2>
      <button class="icon-btn" id="btn-friends-refresh" aria-label="Refresh friends">↻</button>
    </header>
    <div class="friends-body" id="friends-body"></div>
  </section>

  <!-- ONLINE LOBBY -->
  <section id="lobby" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back">←</button>
      <h2 class="bar-title">Online duel</h2>
      <span class="bar-side"></span>
    </header>
    <div class="lobby">
      <button id="btn-lobby-friends" class="fb-panel" hidden>
        <span class="fb-mark" aria-hidden="true">f</span>
        <span><b>Play with Facebook friends</b><small>See who's online and send an invite</small></span>
        <i aria-hidden="true">›</i>
      </button>
      <div class="panel">
        <h3>Host a room</h3>
        <div class="opt-group">
          <span>Mode</span>
          <div class="size-pick" id="pick-duel" role="radiogroup" aria-label="Duel mode">
            <button class="chip" data-v="race" role="radio">Race</button>
            <button class="chip" data-v="turns" role="radio">Take turns</button>
          </div>
          <p class="muted small" id="duel-desc"></p>
        </div>
        <div class="opt-group">
          <span>Board</span>
          <div class="size-pick" id="pick-size" role="radiogroup" aria-label="Board size">
            <button class="chip" data-v="small" role="radio">Compact</button>
            <button class="chip" data-v="big" role="radio">Grand</button>
          </div>
        </div>
        <button id="btn-host" class="primary">Create room</button>
        <div id="host-box" class="code-box" hidden>
          <span class="code" id="room-code">-----</span>
          <div class="code-actions">
            <button id="btn-copy-code" class="ghost">Copy code</button>
            <button id="btn-copy-link" class="ghost">Copy invite link</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <h3>Join a room</h3>
        <form id="join-form" class="join">
          <label class="sr-only" for="join-code">Room code</label>
          <input id="join-code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">
          <button class="primary" type="submit">Join</button>
        </form>
      </div>
      <p id="lobby-status" class="status" role="status"></p>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" id="btn-quit" aria-label="Back to menu">←</button>
      <h2 class="bar-title" id="game-title">Level 1</h2>
      <div class="bar-actions">
        <button class="icon-btn" id="btn-hint" aria-label="Hint"><span>?</span><b id="hint-count">3</b></button>
        <button class="icon-btn" id="btn-shuffle" aria-label="Shuffle"><span>⇄</span><b id="shuffle-count">3</b></button>
      </div>
    </header>

    <div class="hud" id="hud-solo">
      <div class="clock"><i id="clock-fill"></i><span id="clock-text">0:00</span></div>
      <div class="stats">
        <div><span class="label">Score</span><b id="score">0</b></div>
        <div class="combo-box"><span class="label">Combo</span><b id="combo">×1</b><i id="combo-bar"></i></div>
        <div><span class="label">Tiles left</span><b id="left">0</b></div>
      </div>
      <div class="rival" id="rival" hidden>
        <span class="label">Rival</span>
        <div class="rival-bar"><i id="rival-fill"></i></div>
        <b id="rival-text">0 left</b>
      </div>
    </div>

    <div class="hud" id="hud-duel" hidden>
      <div class="players">
        <div class="player p0" id="chip-0"><span class="dot"></span><span class="pname" id="pname-0">Jade</span><b id="pscore-0">0</b></div>
        <span class="turn-note" id="turn-note"></span>
        <div class="player p1" id="chip-1"><b id="pscore-1">0</b><span class="pname" id="pname-1">Ember</span><span class="dot"></span></div>
      </div>
      <div class="turn-clock"><i id="turn-fill"></i></div>
    </div>

    <div class="board-wrap" id="board-wrap">
      <div class="tray" id="tray" aria-hidden="true"></div>
      <canvas id="board"></canvas>
      <div id="fx-layer" aria-live="polite"></div>
      <div id="banner" class="banner" hidden></div>
    </div>

    <div class="foot">
      <p id="goal" class="goal"></p>
      <div id="emotes" class="emotes" hidden>
        <button data-emote="🔥">🔥</button><button data-emote="😱">😱</button><button data-emote="😎">😎</button><button data-emote="👏">👏</button><button data-emote="GG">GG</button>
      </div>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-stars" class="stars-big" hidden></div>
    <h2 id="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="vendor/capacitor.js" defer></script>
<script src="vendor/peerjs.min.js" defer></script>
<script src="js/mahjong.js" defer></script>
<script src="js/tiles.js" defer></script>
<script src="js/board.js" defer></script>
<script src="js/audio.js" defer></script>
<script src="js/net.js" defer></script>
<script src="js/native.js" defer></script>
<script src="js/ads.js" defer></script>
<script src="js/social.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/selftest.js" defer></script>
</body>
</html>
