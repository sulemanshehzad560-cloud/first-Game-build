<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Jade Rush</title>
<meta name="description" content="Jade Rush is a Mahjong tile-matching game with endless levels, a clock to beat, and two-player online duels.">
<meta name="theme-color" content="#0d2622">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="loader" aria-hidden="true"><div class="loader-tile">中</div><p>Jade <span>Rush</span></p></div>
<main id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <header class="brand">
      <canvas id="demo" aria-label="Tiles being matched on a small demo board"></canvas>
      <h1 class="logo">Jade<span>Rush</span></h1>
      <p class="tagline">Match free tiles. Beat the clock. Beat your friends.</p>
    </header>

    <nav class="menu">
      <button id="btn-continue" class="cta">
        <span class="cta-shine" aria-hidden="true"></span>
        <span class="cta-eyebrow" id="continue-chapter">Chapter 1 · Bamboo Grove</span>
        <span class="cta-title" id="continue-label">Level 1</span>
        <span class="cta-meta" id="continue-meta">Endless levels</span>
        <span class="cta-play" aria-hidden="true">▶</span>
      </button>
      <div class="trio">
        <button id="btn-levels" class="tile t-teal">
          <span class="mini" aria-hidden="true">一</span>
          <span class="tile-title">Level map</span>
          <span class="tile-meta" id="levels-meta">Replay for 3 ★</span>
        </button>
        <button id="btn-daily" class="tile t-amber">
          <span class="mini" aria-hidden="true">東</span>
          <span class="tile-title">Daily board</span>
          <span class="tile-meta" id="daily-meta">New every day</span>
        </button>
        <button id="btn-themes" class="tile t-pink">
          <span class="mini" aria-hidden="true">發</span>
          <span class="tile-title">Tile sets</span>
          <span class="tile-meta" id="themes-meta">1 of 6 unlocked</span>
        </button>
      </div>

      <h2 class="section-label">Duel <span>2 players</span></h2>
      <div class="trio">
        <button id="btn-online" class="tile t-violet"><span class="mini" aria-hidden="true">中</span><span class="tile-title">Online</span><span class="tile-meta" id="online-meta">Race or take turns</span></button>
        <button id="btn-local" class="tile t-coral"><span class="mini" aria-hidden="true">南</span><span class="tile-title">Pass &amp; play</span><span class="tile-meta">One device</span></button>
        <button id="btn-ai" class="tile t-blue"><span class="mini" aria-hidden="true">北</span><span class="tile-title">Vs computer</span><span class="tile-meta" id="ai-meta">3 levels</span></button>
      </div>
    </nav>

    <footer class="home-foot">
      <button id="btn-howto" class="link">How to play</button>
      <button id="btn-settings" class="link">Settings</button>
    </footer>
  </section>

  <!-- LEVEL MAP -->
  <section id="levels" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back">←</button>
      <h2 class="bar-title">Level map</h2>
      <span class="bar-side" id="levels-stars">0 ★</span>
    </header>
    <div class="level-scroll" id="level-grid"></div>
  </section>

  <!-- FRIENDS -->
  <section id="friends" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back">←</button>
      <h2 class="bar-title">Friends</h2>
      <button class="icon-btn" id="btn-friends-refresh" aria-label="Refresh friends">↻</button>
    </header>
    <div class="friends-body" id="friends-body"></div>
  </section>

  <!-- ONLINE LOBBY -->
  <section id="lobby" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back">←</button>
      <h2 class="bar-title">Online duel</h2>
      <span class="bar-side"></span>
    </header>
    <div class="lobby">
      <button id="btn-lobby-friends" class="fb-panel" hidden>
        <span class="fb-mark" aria-hidden="true">f</span>
        <span><b>Play with Facebook friends</b><small>See who's online and send an invite</small></span>
        <i aria-hidden="true">›</i>
      </button>
      <div class="panel">
        <h3>Host a room</h3>
        <div class="opt-group">
          <span>Mode</span>
          <div class="size-pick" id="pick-duel" role="radiogroup" aria-label="Duel mode">
            <button class="chip" data-v="race" role="radio">Race</button>
            <button class="chip" data-v="turns" role="radio">Take turns</button>
          </div>
          <p class="muted small" id="duel-desc"></p>
        </div>
        <div class="opt-group">
          <span>Board</span>
          <div class="size-pick" id="pick-size" role="radiogroup" aria-label="Board size">
            <button class="chip" data-v="small" role="radio">Compact</button>
            <button class="chip" data-v="big" role="radio">Grand</button>
          </div>
        </div>
        <button id="btn-host" class="primary">Create room</button>
        <div id="host-box" class="code-box" hidden>
          <span class="code" id="room-code">-----</span>
          <div class="code-actions">
            <button id="btn-copy-code" class="ghost">Copy code</button>
            <button id="btn-copy-link" class="ghost">Copy invite link</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <h3>Join a room</h3>
        <form id="join-form" class="join">
          <label class="sr-only" for="join-code">Room code</label>
          <input id="join-code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE">
          <button class="primary" type="submit">Join</button>
        </form>
      </div>
      <p id="lobby-status" class="status" role="status"></p>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <header class="bar">
      <button class="icon-btn" id="btn-quit" aria-label="Back to menu">←</button>
      <h2 class="bar-title" id="game-title">Level 1</h2>
      <div class="bar-actions">
        <button class="icon-btn" id="btn-hint" aria-label="Hint"><span>?</span><b id="hint-count">3</b></button>
        <button class="icon-btn" id="btn-shuffle" aria-label="Shuffle"><span>⇄</span><b id="shuffle-count">3</b></button>
      </div>
    </header>

    <div class="hud" id="hud-solo">
      <div class="clock"><i id="clock-fill"></i><span id="clock-text">0:00</span></div>
      <div class="stats">
        <div><span class="label">Score</span><b id="score">0</b></div>
        <div class="combo-box"><span class="label">Combo</span><b id="combo">×1</b><i id="combo-bar"></i></div>
        <div><span class="label">Tiles left</span><b id="left">0</b></div>
      </div>
      <div class="rival" id="rival" hidden>
        <span class="label">Rival</span>
        <div class="rival-bar"><i id="rival-fill"></i></div>
        <b id="rival-text">0 left</b>
      </div>
    </div>

    <div class="hud" id="hud-duel" hidden>
      <div class="players">
        <div class="player p0" id="chip-0"><span class="dot"></span><span class="pname" id="pname-0">Jade</span><b id="pscore-0">0</b></div>
        <span class="turn-note" id="turn-note"></span>
        <div class="player p1" id="chip-1"><b id="pscore-1">0</b><span class="pname" id="pname-1">Ember</span><span class="dot"></span></div>
      </div>
      <div class="turn-clock"><i id="turn-fill"></i></div>
    </div>

    <div class="board-wrap" id="board-wrap">
      <canvas id="board"></canvas>
      <div id="fx-layer" aria-live="polite"></div>
      <div id="banner" class="banner" hidden></div>
    </div>

    <div class="foot">
      <p id="goal" class="goal"></p>
      <div id="emotes" class="emotes" hidden>
        <button data-emote="🔥">🔥</button><button data-emote="😱">😱</button><button data-emote="😎">😎</button><button data-emote="👏">👏</button><button data-emote="GG">GG</button>
      </div>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-stars" class="stars-big" hidden></div>
    <h2 id="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="vendor/capacitor.js" defer></script>
<script src="vendor/peerjs.min.js" defer></script>
<script src="js/mahjong.js" defer></script>
<script src="js/tiles.js" defer></script>
<script src="js/board.js" defer></script>
<script src="js/audio.js" defer></script>
<script src="js/net.js" defer></script>
<script src="js/native.js" defer></script>
<script src="js/ads.js" defer></script>
<script src="js/social.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/selftest.js" defer></script>
</body>
</html>
