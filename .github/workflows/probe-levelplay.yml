name: Probe LevelPlay SDK
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Versions and API
        run: |
          base=https://android-sdk.is.com
          for a in com/unity3d/ads-mediation/mediation-sdk com/ironsource/sdk/mediationsdk \
                   com/unity3d/ads-mediation/unityads-adapter com/ironsource/adapters/unityadsadapter \
                   com/unity3d/ads-mediation/facebook-adapter com/ironsource/adapters/facebookadapter \
                   com/unity3d/ads-mediation/admob-adapter com/ironsource/adapters/admobadapter; do
            echo "== $a: $(curl -s $base/$a/maven-metadata.xml | grep -oE '<(latest|release)>[^<]*' | head -2 | tr '\n' ' ')"
          done
          for g in com/unity3d/ads-mediation/mediation-sdk com/ironsource/sdk/mediationsdk; do
            v=$(curl -s $base/$g/maven-metadata.xml | grep -oE '<release>[^<]*' | sed 's/<release>//')
            [ -z "$v" ] && continue
            n=$(basename $g)
            curl -s -o sdk.aar "$base/$g/$v/$n-$v.aar" || continue
            ls -la sdk.aar; mkdir -p x && cd x && unzip -o -q ../sdk.aar classes.jar && cd ..
            echo "== classes in $g $v"
            unzip -l x/classes.jar | grep -oE 'com/unity3d/mediation/[A-Za-z/]*(LevelPlay|Init)[A-Za-z]*\.class' | sort -u | head -60
            for c in com.unity3d.mediation.LevelPlay com.unity3d.mediation.LevelPlayInitRequest\$Builder com.unity3d.mediation.LevelPlayInitListener \
                     com.unity3d.mediation.interstitial.LevelPlayInterstitialAd com.unity3d.mediation.interstitial.LevelPlayInterstitialAdListener \
                     com.unity3d.mediation.rewarded.LevelPlayRewardedAd com.unity3d.mediation.rewarded.LevelPlayRewardedAdListener; do
              echo "--- $c"; javap -cp x/classes.jar "$c" 2>&1 | head -40
            done
            rm -rf x sdk.aar
          done
