name: App builds

on:
  push:
    branches: [ccr-61d5e997-33280i]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_NAME: 1.0.0

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      code: ${{ steps.meta.outputs.code }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Version code
        id: meta
        run: echo "code=$((200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Game engine tests
        run: npm test

      - name: Copy web game into the Android project
        run: npm run build && npx cap sync android

      - name: Release signing (only when keystore secrets are configured)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.JADE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "JADE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint, debug APK and release bundle
        working-directory: android
        env:
          JADE_VERSION_CODE: ${{ steps.meta.outputs.code }}
          FB_APP_ID: ${{ vars.FB_APP_ID }}
          FB_CLIENT_TOKEN: ${{ vars.FB_CLIENT_TOKEN }}
          JADE_KEYSTORE_PASSWORD: ${{ secrets.JADE_KEYSTORE_PASSWORD }}
          JADE_KEY_ALIAS: ${{ secrets.JADE_KEY_ALIAS }}
          JADE_KEY_PASSWORD: ${{ secrets.JADE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lintDebug assembleDebug bundleRelease

      - name: Collect outputs
        run: |
          mkdir -p dist
          CODE=${{ steps.meta.outputs.code }}
          SUFFIX=$([ "${{ steps.sign.outputs.signed }}" = "true" ] && echo "release" || echo "release-unsigned")
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/jade-rush-${VERSION_NAME}-${CODE}-debug.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/jade-rush-${VERSION_NAME}-${CODE}-${SUFFIX}.aab"
          cp android/app/build/reports/lint-results-debug.html dist/lint-report.html || true
          cp android/app/build/reports/lint-results-debug.xml dist/lint-report.xml || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: dist/

  emulator:
    name: Emulator tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: dist

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test tools
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          npm install --no-save playwright@1.56.1
          gh release download -R google/bundletool --pattern 'bundletool-all-*.jar' -O bundletool.jar

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-run.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: e2e-out/

  ios:
    name: iOS build and simulator test
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Copy web game into the iOS project
        run: npm ci && npm run build && npx cap sync ios

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for the iOS simulator
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= ENABLE_DEBUG_DYLIB=NO build 2>&1 | tail -40

      # A stalled macOS runner must fail this step, not eat the whole job (the release waits on it).
      - name: Simulator self-test
        timeout-minutes: 25
        run: bash ci/ios-smoke.sh

      - name: Zip the simulator app
        if: always()
        run: |
          mkdir -p ios-out
          APP=$(find build/ios/Build/Products -maxdepth 2 -name App.app -path '*iphonesimulator*' | head -1)
          [ -n "$APP" ] && (cd "$(dirname "$APP")" && zip -q -r "$GITHUB_WORKSPACE/ios-out/jade-rush-simulator.app.zip" App.app) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: ios-out/

  # App Store build: its own macOS runner, so a stalled simulator test cannot hold it up. Runs only
  # when the App Store Connect secrets and the Team ID are configured (see docs/APP_STORE_GUIDE.md).
  testflight:
    name: iOS App Store build and TestFlight upload
    if: ${{ vars.APPLE_TEAM_ID != '' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Copy web game into the iOS project
        run: npm ci && npm run build && npx cap sync ios

      - name: Signed archive, .ipa and TestFlight upload
        timeout-minutes: 30
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
          ADMOB_IOS_INTERSTITIAL_ID: ${{ vars.ADMOB_IOS_INTERSTITIAL_ID }}
        run: |
          set -eo pipefail
          CODE=$((200 + GITHUB_RUN_NUMBER))
          KEY_DIR="$HOME/.appstoreconnect/private_keys"; mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_KEY_P8" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          ADS=()
          [ -n "$ADMOB_IOS_APP_ID" ] && ADS+=(ADMOB_IOS_APP_ID="$ADMOB_IOS_APP_ID")
          [ -n "$ADMOB_IOS_INTERSTITIAL_ID" ] && ADS+=(ADMOB_IOS_INTERSTITIAL_ID="$ADMOB_IOS_INTERSTITIAL_ID")
          # Archive unsigned, then sign once at export for the App Store. Signing the archive itself
          # needs a development profile, which Apple only issues to teams with registered devices.
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/JadeRush.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$CODE" MARKETING_VERSION="$VERSION_NAME" "${ADS[@]}" 2>&1 | tail -30
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ci/ios-export.plist > build/export.plist
          xcodebuild -exportArchive -archivePath build/JadeRush.xcarchive -exportPath build/ipa -exportOptionsPlist build/export.plist "${AUTH[@]}" 2>&1 | tail -20
          mkdir -p ios-out && cp build/ipa/*.ipa "ios-out/jade-rush-${VERSION_NAME}-${CODE}.ipa"
          IPA="ios-out/jade-rush-${VERSION_NAME}-${CODE}.ipa"
          if [ -n "$ASC_APP_ID" ]; then
            # The app's numeric Apple ID (App Store Connect -> App Information) skips the bundle ID lookup.
            xcrun altool --upload-package "$IPA" --type ios --apple-id "$ASC_APP_ID" --bundle-id com.jaderush.app \
              --bundle-version "$CODE" --bundle-short-version-string "$VERSION_NAME" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -20
          else
            xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -20
          fi
          echo "PASS signed build ${CODE} uploaded to App Store Connect (TestFlight)" | tee -a ios-out/report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-results
          path: ios-out/

  release:
    name: Publish GitHub release
    needs: [build, emulator, ios, testflight]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: builds
          path: dist

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: emulator-results
          path: e2e

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-results
          path: ios

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: testflight-results
          path: testflight

      - name: Release notes
        env:
          CODE: ${{ needs.build.outputs.code }}
          TESTS: ${{ needs.emulator.result }}
          IOS: ${{ needs.ios.result }}
          TESTFLIGHT: ${{ needs.testflight.result }}
        run: |
          if [ -d e2e ]; then (cd e2e && zip -q -r ../dist/emulator-test-results.zip .); fi
          mv testflight/*.ipa dist/ 2>/dev/null || true
          if [ -d ios ]; then
            mv ios/*.ipa dist/ 2>/dev/null || true
            mv ios/jade-rush-simulator.app.zip dist/ 2>/dev/null || true
            (cd ios && zip -q -r ../dist/ios-test-results.zip .)
          fi
          {
            echo "Jade Rush ${VERSION_NAME} (version code ${CODE})"
            echo
            echo "- jade-rush-*-debug.apk: install directly on a phone for testing (shows Google test ads)."
            echo "- jade-rush-*.aab: the release bundle for Google Play."
            echo "- emulator-test-results.zip: screenshots, logcat and the test report."
            echo
            echo "Emulator tests: ${TESTS}"
            if [ -f e2e/report.txt ]; then echo; echo '```'; cat e2e/report.txt; echo '```'; fi
            echo
            echo "iOS simulator tests: ${IOS}"
            if [ -f ios/report.txt ]; then echo; echo '```'; cat ios/report.txt; echo '```'; fi
            echo
            echo "App Store / TestFlight upload: ${TESTFLIGHT}"
            if [ -f testflight/report.txt ]; then cat testflight/report.txt; fi
          } > dist/RELEASE-NOTES.md
          cat dist/RELEASE-NOTES.md

      # Build outputs also go to the ci-builds branch (one commit, replaced every build),
      # which works even where creating releases is not allowed.
      - name: Publish to ci-builds branch
        env:
          CODE: ${{ needs.build.outputs.code }}
        run: |
          # A git branch refuses files over 100 MB, and the app is bigger than that now: the branch copy
          # splits those into 90 MB parts (rejoin with: cat name.part-* > name). The GitHub release
          # below keeps every file whole, so it has one download link per build.
          cp -r dist branch && cd branch
          for f in *; do
            if [ "$(stat -c %s "$f")" -gt 95000000 ]; then split -b 90m -d "$f" "$f.part-" && rm "$f" && echo "split $f"; fi
          done
          git init -q -b ci-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jade Rush ${VERSION_NAME} build ${CODE} (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-builds

      - name: Create GitHub release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          gh release create "build-${CODE}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Jade Rush ${VERSION_NAME} (build ${CODE})" --notes-file dist/RELEASE-NOTES.md --prerelease
