<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Update needed</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
    background: #0b2621; color: #fff8ea; font: 16px/1.5 sans-serif; text-align: center; }
  .tile { width: 64px; height: 84px; margin: 0 auto 20px; border-radius: 10px; background: #e8c590; color: #a8141f;
    font: bold 40px/84px serif; box-shadow: 0 6px 0 #8a5a2b; }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { color: #b9d1c7; margin: 0 0 22px; }
  a { display: inline-block; padding: 14px 22px; border-radius: 14px; background: #ffc94a; color: #2a1a00; font-weight: bold; text-decoration: none; }
</style>
</head>
<body>
<div>
  <div class="tile">&#20013;</div>
  <h1>One quick update</h1>
  <p>Jade Rush needs a newer version of Android System WebView, the component Android uses to draw the game. Update it from Google Play, then open Jade Rush again.</p>
  <a href="market://details?id=com.google.android.webview">Update Android System WebView</a>
</div>
</body>
</html>
