<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../js/mahjong.js"></script>
<script src="../js/tiles.js"></script>
<script src="../js/board.js"></script>
<script>
// Store and launcher artwork drawn with the game's own tile renderer.
const T = MahjongTiles, theme = T.THEMES[0];
function tileBoard(canvas, fw, dpr) {
  const pb = new TileBoard(canvas);
  pb.setTheme(theme); pb.dpr = dpr; pb.fw = fw; pb.fh = fw * 1.3; pb.dz = fw * 0.12;
  return pb;
}
function table(g, w, h) {
  const base = g.createRadialGradient(w * 0.5, h * 0.38, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.75);
  base.addColorStop(0, '#1f7a5f'); base.addColorStop(0.55, '#145244'); base.addColorStop(1, '#0b2621');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const glow = g.createRadialGradient(w * 0.75, h * 0.2, 0, w * 0.75, h * 0.2, w * 0.6);
  glow.addColorStop(0, 'rgba(255,201,74,0.22)'); glow.addColorStop(1, 'rgba(255,201,74,0)');
  g.fillStyle = glow; g.fillRect(0, 0, w, h);
}
function tile(pb, g, cx, cy, kind, rot, variant) {
  const r = { x: cx - pb.fw / 2, y: cy - pb.fh / 2, w: pb.fw, h: pb.fh };
  pb.drawTile(g, r, kind, { rot: rot, variant: variant });
}
// mode: icon-full | icon-fg | icon-bg | splash | feature | favicon
window.render = async function (mode, size, h) {
  await document.fonts.load('700 40px "Noto Serif SC"', '中發東萬');
  await document.fonts.load('800 40px "Bricolage Grotesque"', 'Jade Rush');
  await document.fonts.load('600 40px Figtree', 'Match wooden tiles.');
  const c = document.getElementById('c'), W = size, H = h || size;
  c.width = W; c.height = H; c.style.width = W + 'px'; c.style.height = H + 'px';
  const g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  if (mode === 'icon-bg') { table(g, W, H); return; }
  if (mode === 'feature') {
    table(g, W, H);
    const pb = tileBoard(c, H * 0.27, 1);
    [[31, -0.2], [32, -0.07], [27, 0.07], [0, 0.2]].forEach(([k, r], i) => tile(pb, g, W * 0.665 + i * pb.fw * 0.8, H * 0.5 + Math.abs(i - 1.5) * H * 0.05, k, r, i));
    g.textBaseline = 'alphabetic';
    g.font = '800 ' + H * 0.17 + 'px "Bricolage Grotesque"'; g.fillStyle = '#fff8ea';
    g.fillText('Jade', W * 0.06, H * 0.47);
    g.font = 'italic 800 ' + H * 0.17 + 'px "Bricolage Grotesque"'; g.fillStyle = '#ffc94a';
    g.fillText('Rush', W * 0.06 + g.measureText('Jade ').width, H * 0.47);
    g.font = '600 ' + H * 0.055 + 'px Figtree'; g.fillStyle = 'rgba(255,248,234,0.85)';
    g.fillText('Match wooden tiles. Beat the clock.', W * 0.065, H * 0.62);
    g.fillText('Duel your friends online.', W * 0.065, H * 0.72);
    return;
  }
  const full = mode === 'icon-full' || mode === 'favicon';
  if (full) table(g, W, H);
  // Adaptive icons keep art inside the central 66/108 safe zone.
  const zone = mode === 'icon-fg' ? W * 0.61 : mode === 'splash' ? W * 0.9 : W * 0.86;
  const pb = tileBoard(c, zone * 0.46, 1);
  tile(pb, g, W / 2 - pb.fw * 0.36, H / 2 + pb.fh * 0.02, 32, -0.2, 3);
  tile(pb, g, W / 2 + pb.fw * 0.3, H / 2 - pb.fh * 0.04, 31, 0.12, 1);
};
</script>
</body></html>
