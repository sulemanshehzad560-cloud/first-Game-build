apply plugin: 'com.android.application'

// Release signing comes from environment variables (CI secrets) or android/keystore.properties.
// Without either, bundleRelease produces an unsigned bundle that can be signed afterwards with jarsigner.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String key, String env -> System.getenv(env) ?: keystoreProps.getProperty(key) }
def releaseStore = signingValue('storeFile', 'JADE_KEYSTORE_FILE')

// Facebook Login: set FB_APP_ID / FB_CLIENT_TOKEN (GitHub repository variables) or
// jade.facebookAppId / jade.facebookClientToken in android/gradle.properties.
// Without them the SDK gets a placeholder and the Friends feature stays hidden.
def fbAppId = (System.getenv('FB_APP_ID') ?: (project.findProperty('jade.facebookAppId') ?: '')).toString().trim()
def fbClientToken = (System.getenv('FB_CLIENT_TOKEN') ?: (project.findProperty('jade.facebookClientToken') ?: '')).toString().trim()
def fbEnabled = !fbAppId.isEmpty() && !fbClientToken.isEmpty()
if (!fbEnabled) { fbAppId = '100000000000000'; fbClientToken = 'not-configured' }

android {
    namespace = "com.sulemanshehzad.jaderush"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jaderush.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('JADE_VERSION_CODE') ?: '1')
        versionName "1.0.0"
        resValue "string", "facebook_app_id", fbAppId
        resValue "string", "facebook_client_token", fbClientToken
        resValue "string", "fb_login_protocol_scheme", "fb" + fbAppId
        buildConfigField "boolean", "FACEBOOK_ENABLED", fbEnabled.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        // Shared debug key so Facebook key hashes stay the same on every CI build.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword signingValue('storePassword', 'JADE_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'JADE_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'JADE_KEY_PASSWORD')
            }
        }
    }
    lint {
        abortOnError = false
        checkReleaseBuilds = true
        htmlReport = true
        xmlReport = true
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
